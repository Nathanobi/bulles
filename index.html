<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04050a">
<meta name="description" content="Prise et tri de notes en bulles imbriquées, sur un ciel étoilé.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bulles">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Bulles d'idées</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=DM+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="cv" tabindex="0" role="application" aria-label="Espace de bulles. Glisse les bulles pour les ranger, pince ou fais défiler pour zoomer."></canvas>
<div id="ui">
  <header id="top" class="glass">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true"><circle cx="8" cy="9" r="6" stroke="#a9b8ff" stroke-width="1.5"/><circle cx="15" cy="12" r="4.5" stroke="#d6a9ff" stroke-width="1.5"/><circle cx="9" cy="16.5" r="3" stroke="#9fe0cf" stroke-width="1.5"/></svg>
      <span>Bulles d'idées</span>
    </div>
    <p id="hint"></p>
    <span id="status" class="chip" role="status" data-s="warn"><i></i><b>Connexion…</b></span>
    <div class="tools">
      <button class="icon" id="zOut" aria-label="Dézoomer" title="Dézoomer"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="8" cy="8" r="5.5"/><path d="M5.5 8h5M12.2 12.2 16 16"/></svg></button>
      <button class="icon" id="zIn" aria-label="Zoomer" title="Zoomer"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="8" cy="8" r="5.5"/><path d="M5.5 8h5M8 5.5v5M12.2 12.2 16 16"/></svg></button>
      <button class="icon" id="zFit" aria-label="Tout voir" title="Tout voir"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.5v-4h4M11.5 2.5h4v4M15.5 11.5v4h-4M6.5 15.5h-4v-4"/></svg></button>
      <button class="icon" id="planBtn" aria-label="Plan en texte" aria-expanded="false" aria-controls="plan" title="Plan en texte"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3.5h8M6 9h8M6 14.5h8M3.5 3.5v11M3.5 9H6"/></svg></button>
      <button class="icon" id="optBtn" aria-label="Réglages" aria-expanded="false" aria-controls="drawer" title="Réglages"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2.5 5h5M11.5 5h4M2.5 13h2M8.5 13h7"/><circle cx="9.5" cy="5" r="2"/><circle cx="6.5" cy="13" r="2"/></svg></button>
    </div>
  </header>

  <div id="empty" hidden><span>Aucune bulle pour l'instant.<br>Écris une première note en bas : elle ira dans la bulle souche.</span></div>

  <section id="panel" class="sheet glass" hidden aria-label="Détails de la bulle">
    <button class="icon" id="pClose" aria-label="Fermer la fiche"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg></button>
    <div class="crumb" id="crumb"></div>
    <label class="fld"><span>Nom</span><input id="pn" maxlength="120" placeholder="Nom de la bulle" autocomplete="off"></label>
    <label class="fld"><span>Commentaire</span><textarea id="pc" rows="3" maxlength="2000" placeholder="Une précision, un rappel…"></textarea></label>
    <div class="fld"><span>Contour</span><div id="sw" class="sw"></div></div>
    <div class="acts">
      <button class="btn" id="aKid" type="button">+ Sous-bulle</button>
      <button class="btn" id="aWrap" type="button">Regrouper…</button>
      <button class="btn" id="aOut" type="button">Sortir</button>
      <button class="btn danger" id="aDel" type="button">Supprimer</button>
    </div>
    <form id="wrapRow" class="row" hidden>
      <input id="wn" maxlength="120" placeholder="Nom du groupe (ex : courses)" aria-label="Nom du groupe" autocomplete="off">
      <button class="btn primary" type="submit">Créer</button>
    </form>
    <div id="delRow" class="delrow" hidden>
      <p id="delTxt"></p>
      <div id="delBtns"></div>
    </div>
  </section>

  <section id="drawer" class="sheet glass" hidden aria-label="Réglages">
    <div class="head"><h2>Réglages</h2><button class="icon" id="dClose" aria-label="Fermer les réglages"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg></button></div>
    <div class="sec"><span class="lbl">Ambiances</span><div class="presets" id="presets"></div></div>
    <div id="opts" style="display:contents"></div>
    <div class="sec">
      <span class="lbl">Synchronisation</span>
      <p class="note" id="syncNote"></p>
      <div class="acts"><button class="btn" id="exBtn" type="button">Sauvegarder (.json)</button><button class="btn" id="imBtn" type="button">Importer</button></div>
      <input id="imFile" type="file" accept="application/json,.json" hidden>
    </div>
    <div class="sec"><button class="btn" id="resetOpts" type="button">Réinitialiser les réglages</button></div>
  </section>

  <section id="plan" class="sheet glass" hidden aria-label="Plan en texte">
    <div class="head"><h2>Plan des bulles</h2><button class="icon" id="plClose" aria-label="Fermer le plan"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg></button></div>
    <div class="row">
      <select id="plFmt" aria-label="Format du plan"><option value="tree">Arbre</option><option value="md">Liste Markdown</option></select>
      <label class="chk"><input type="checkbox" id="plCom" checked>Commentaires</label>
    </div>
    <pre id="plTxt" tabindex="0" aria-label="Plan des bulles en texte"></pre>
    <div class="acts"><button class="btn primary" id="plCopy" type="button">Copier</button><button class="btn" id="plSave" type="button">Enregistrer</button></div>
  </section>

  <form id="wrapPop" class="glass" hidden>
    <p id="wpTxt"></p>
    <input id="wp" maxlength="120" placeholder="Nom du groupe (ex : courses)" aria-label="Nom du nouveau groupe" autocomplete="off">
    <div class="row"><button class="btn primary" type="submit">Créer le groupe</button><button class="btn" type="button" id="wpNo">Non merci</button></div>
  </form>
  <div id="tip" class="glass" hidden></div>
  <div id="toast" role="status"></div>

  <form id="adder" class="glass" autocomplete="off">
    <button type="button" class="btn" id="target" title="Changer la cible"></button>
    <input id="add" maxlength="120" placeholder="Nouvelle note…" aria-label="Nouvelle note" enterkeyhint="send">
    <button class="btn primary" type="submit">Ajouter</button>
  </form>
</div>
<script src="app.js"></script>
<script>
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
